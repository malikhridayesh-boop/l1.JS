<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>variable</h1>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>
    <script>
        var a=100;
        var b=124;
        var c=a+b;
        document.getElementById("add").innerHTML="Addition = " + c;
        var d=b-a;
        document.getElementById("sub").innerHTML = "subtraction = " + d;
        var e=c*d;
        document.getElementById("mul").innerHTML = "product = " + e;
        var f=e/d;
        document.getElementById("div").innerHTML = "answer = " + f;
    </script>
</body>
</html>
